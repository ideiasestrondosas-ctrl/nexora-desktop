[package]
name = "nexora-desktop"
version = "0.31.5-beta.1"
description = "Nexora Media Processing - Desktop Native"
authors = ["Nexora"]
edition = "2021"

[lib]
name = "nexora_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
num_cpus = "1"
sysinfo = { version = "0.32", default-features = false, features = ["system", "network"] }
tokio = { version = "1", features = ["time", "sync", "rt", "io-util", "net", "macros"] }
walkdir = "2"
zip = "4"
base64 = "0.22"
reqwest = { version = "0.12", features = ["multipart", "json"] }
suppaftp = { version = "6", features = ["async", "native-tls"] }
futures-lite = "2"
russh = "0.61"
russh-sftp = "2"
ssh-key = { version = "0.7.0-rc.10", default-features = false }
async-trait = "0.1"
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-rustls-tls"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
keyring = "3"
window-vibrancy = "0.5"
notify = "8"

[target.'cfg(not(target_os = "windows"))'.dependencies]
libc = "0.2"
