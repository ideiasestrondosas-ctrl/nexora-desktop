name: Build Nexora Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_draft:
        description: 'Criar release como draft?'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  quality-gate:
    runs-on: ubuntu-22.04
    name: Quality Gate

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (frontend)
        run: npx tsc --noEmit

      - name: TypeScript check (sidecar)
        run: npm run sidecar:check

      - name: ESLint
        run: npm run lint

      - name: Unit + component tests
        run: npm test

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      # Placeholders para resources e externalBin — tauri_build::build() valida estes caminhos
      - name: Create resource placeholders
        shell: bash
        run: |
          mkdir -p sidecar/dist sidecar/bin
          touch sidecar/dist/nexora-sidecar.cjs
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/nexora-engine-x86_64-unknown-linux-gnu

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

  build:
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2025
            label: Windows
            rust-targets: x86_64-pc-windows-msvc

          - platform: macos-latest
            label: macOS (Universal)
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin

          - platform: ubuntu-22.04
            label: Linux
            rust-targets: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    name: Build — ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Dependencias nativas do Linux (WebKitGTK para Tauri 2.x)
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      # Placeholders para resources e externalBin — tauri_build::build() valida estes caminhos
      - name: Create binary placeholders
        shell: bash
        run: |
          mkdir -p src-tauri/binaries sidecar/bin
          if [[ "${{ matrix.platform }}" == "windows-2025" ]]; then
            touch src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
            touch src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe
            touch src-tauri/binaries/nexora-engine-x86_64-pc-windows-msvc.exe
          elif [[ "${{ matrix.platform }}" == "macos-latest" ]]; then
            touch src-tauri/binaries/ffmpeg-aarch64-apple-darwin
            touch src-tauri/binaries/ffprobe-aarch64-apple-darwin
            touch src-tauri/binaries/ffmpeg-x86_64-apple-darwin
            touch src-tauri/binaries/ffprobe-x86_64-apple-darwin
            touch src-tauri/binaries/ffmpeg-universal-apple-darwin
            touch src-tauri/binaries/ffprobe-universal-apple-darwin
            touch src-tauri/binaries/nexora-engine-aarch64-apple-darwin
            touch src-tauri/binaries/nexora-engine-x86_64-apple-darwin
            touch src-tauri/binaries/nexora-engine-universal-apple-darwin
          else
            touch src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
            touch src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu
            touch src-tauri/binaries/nexora-engine-x86_64-unknown-linux-gnu
          fi

      - name: Install frontend dependencies
        run: npm ci

      # Descarregar FFmpeg e FFprobe para a plataforma alvo
      - name: Download media binaries
        run: node scripts/download-media-binaries.js

      # Build do Nexora Engine (SEA — standalone binary)
      - name: Build Nexora Engine (SEA)
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "windows-2025" ]]; then
            npm run engine:build:win
          elif [[ "${{ matrix.platform }}" == "macos-latest" ]]; then
            npm run engine:build:mac
          else
            npm run engine:build:linux
          fi

      - name: Stage engine binary
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "windows-2025" ]]; then
            cp sidecar/bin/nexora-engine.exe \
               src-tauri/binaries/nexora-engine-x86_64-pc-windows-msvc.exe
          elif [[ "${{ matrix.platform }}" == "macos-latest" ]]; then
            cp sidecar/bin/nexora-engine \
               src-tauri/binaries/nexora-engine-universal-apple-darwin
          else
            cp sidecar/bin/nexora-engine \
               src-tauri/binaries/nexora-engine-x86_64-unknown-linux-gnu
          fi

      # Build + empacotamento por plataforma
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Nexora Desktop ${{ github.ref_name }}'
          releaseBody: |
            ## Nexora Desktop ${{ github.ref_name }}

            ### Instaladores

            | Plataforma | Ficheiro |
            |---|---|
            | Windows | `.msi` ou `.exe` (NSIS) |
            | macOS | `.dmg` (Universal: Intel + Apple Silicon) |
            | Linux | `.deb` (Debian/Ubuntu) ou `.AppImage` |

            Consulta o [CHANGELOG.md](CHANGELOG.md) para detalhes das alteracoes.
          releaseDraft: ${{ github.event.inputs.release_draft != 'false' }}
          prerelease: false
          args: ${{ matrix.args }}

      # Guardar bundle de actualização assinado — o tauri-action nao gera latest.json
      # com Tauri v2, por isso tratamos manualmente no job generate-updater-json.
      - name: Save updater bundle and signature
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # O tauri-action limpa .sig/.tar.gz/.zip apos processar. Sobrevivem apenas os
          # instaladores raw. Solucao: re-assinar com a mesma chave apos o tauri-action.
          VER=$(node -p "require('./package.json').version" | sed 's/-.*//')
          PROD="Nexora Desktop"

          if [[ "${{ matrix.platform }}" == "windows-2025" ]]; then
            BUNDLE="src-tauri/target/release/bundle/nsis/${PROD}_${VER}_x64-setup.exe"
            BUNDLE_RELEASE="${PROD}_${VER}_x64-setup.exe"
            PLATFORM="windows-x86_64"
          elif [[ "${{ matrix.platform }}" == "macos-latest" ]]; then
            BUNDLE="src-tauri/target/universal-apple-darwin/release/bundle/macos/${PROD}.app.tar.gz"
            BUNDLE_RELEASE="${PROD}_universal.app.tar.gz"
            PLATFORM="darwin-universal"
          else
            BUNDLE="src-tauri/target/release/bundle/appimage/${PROD}_${VER}_amd64.AppImage"
            BUNDLE_RELEASE="${PROD}_${VER}_amd64.AppImage"
            PLATFORM="linux-x86_64"
          fi

          if [ ! -f "$BUNDLE" ]; then
            echo "ERRO: bundle nao encontrado: $BUNDLE"
            ls "$(dirname "$BUNDLE")/" 2>/dev/null || true
            exit 1
          fi

          # Re-assinar o bundle. TAURI_SIGNING_PRIVATE_KEY e TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          # estao no env desta step — tauri signer sign le-os automaticamente (igual ao cargo tauri build).
          # NAO usar --private-key <path>: a CLI tenta base64-decode do path e falha em '_'.
          npx tauri signer sign "$BUNDLE"

          mkdir -p updater-info
          cat "${BUNDLE}.sig" > updater-info/sig.txt
          echo "$BUNDLE_RELEASE" > updater-info/bundle-name.txt
          echo "$PLATFORM" > updater-info/platform.txt

      - name: Upload updater info
        uses: actions/upload-artifact@v7
        with:
          name: updater-info-${{ matrix.platform }}
          path: updater-info/

  generate-updater-json:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Download updater info from all platforms
        uses: actions/download-artifact@v7
        with:
          pattern: updater-info-*
          merge-multiple: false
          path: updater-artifacts

      - name: Generate and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/ci-generate-updater-json.mjs updater-artifacts
